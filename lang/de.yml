        name: kombos
        aliases: []
        description: "So baust du die Block-Kombos"
        sub:
          mine:
            name: meine
            aliases: []
            description: "Deine eigenen Block-Kombos mit Position und Entfernung, nächste zuerst"
      traps:
        name: fallen
        aliases: []
        description: "So baust und benutzt du Monsterfallen"
