    - "3×3 bauen: acht Obsidianblöcke als Rahmen, in der Mitte ein Kolben (Werfen), Eisenblock (Stacheln) oder Honigblock (Verlangsamen)."
    - "Schleuderfalle: Schleimblock im Obsidianrahmen, genau ein Knopf vorne am Rahmen. Boden/Decke schleudern vom Knopf weg; Wände nach vorne und oben."
    - "Der Kolben zeigt in Wurfrichtung. Rahmen und Fallen funktionieren am Boden, an Wänden und an der Decke."
    - "Einen Knopf auf der Vorderseite eines Obsidian-Rahmenblocks anbringen. Der erste Rechtsklick registriert die Falle; Automatik ist zunächst an."
    - "Knopf: manuell auslösen. Shift + Rechtsklick auf den Knopf: Automatik und 10/15 Sekunden Cooldown einstellen. Beide Auslösearten teilen denselben Cooldown."
    - "Wirkbereich: 3×3 breit, 3 Blöcke vor der Fläche, mit freier Sicht. Nur feindliche Monster; keine Spieler oder Haustiere."
    - "Stacheln verursachen standardmäßig 6 Schaden, Teer verlangsamt 5 Sekunden. Auto und Knopf benötigen ein gültiges Ziel."
    - "Rahmen oder Knopf entfernen pausiert die Falle; Kern entfernen meldet sie nach Ablauf des Cooldowns ab. Ungeladene Chunks werden nicht geladen."
  type:
    sling: "Schleuderfalle"
    throw: "Wurffalle"
    spikes: "Stachelfalle"
    tar: "Teerfalle"

