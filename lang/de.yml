        sub:
          list:
            name: liste
            aliases: []
            description: "Deine gesperrten Plätze zeigen"
          clear:
            name: leeren
            aliases: []
            description: "Alle Plätze freigeben"
          item:
            name: gegenstand
            aliases: []
            description: "Den gehaltenen Gegenstandstyp in allen Slots sperren oder freigeben"
          items:
            name: gegenstaende
            aliases: []
            description: "Deine gesperrten Gegenstandstypen anzeigen"
          clearitems:
            name: gegenstaendeleeren
            aliases: []
            description: "Alle Gegenstandstypen freigeben"
      chestpriority:
