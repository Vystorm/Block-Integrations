furnace:
  name:
    furnace: "Furnace"
    blast-furnace: "Blast Furnace"
    smoker: "Smoker"
  guide:
    intro:
      - "<gold><bold>Upgradable furnaces"
      - "<gray>Supported: <white>furnace, blast furnace and smoker<gray>."
      - "<gray>The player who places one becomes its fixed owner. Existing furnaces are claimed with sneak + right-click."
      - "<gray>With Vystorm Skills installed, hopper-fed automatic smelting gives the owner smelting/cooking skill XP and uses the owner's smelting abilities."
      - "<gray>Vanilla XP collected while the furnace runs can be withdrawn in the furnace menu with \"Withdraw stored XP\"."
    paths: "<gray>Upgrade paths up to level {max}: <white>smelting speed, fuel efficiency, bonus yield and multismelt<gray>."
    outro:
      - "<gray>The XP boost has at most <white>5 levels <gray>and increases the stored vanilla XP as well as smelting/cooking skill XP (Vystorm Skills)."
      - "<gray>Each multismelt level processes one additional item in the same smelting cycle and grants furnace and skill XP for it."
  placed: "<green>This {name} now permanently belongs to you. <gray>Sneak + right-click to open the upgrades. "
  no-use: "<red>You are not allowed to use upgradable furnaces."
  claimed: "<green>Furnace claimed and permanently linked to your skill profile."
  owned-by: "<red>This furnace permanently belongs to <white>{owner}<red>."
  unknown-owner: "Unknown"
  gone: "<red>The furnace no longer exists."
  no-upgrade-permission: "<red>You are not allowed to upgrade furnaces."
  maxed: "<yellow>This furnace upgrade path is already maxed out."
  no-owner: "<red>This furnace has no fixed owner."
  only-owner: "<red>Only the fixed owner can withdraw the stored XP."
  no-xp: "<yellow>This furnace has not stored a full XP point yet."
  withdraw-failed: "<red>The furnace XP could not be withdrawn."
  withdrawn: "<green>You withdrew <yellow>{xp} XP points <green>from the {name}."
  dialog:
    title: "{name} Upgrades"
    header: "{name} | Owner: {owner}"
    withdraw: "Withdraw stored XP ({xp})"
  metrics:
    pending-skill: "<gray>Queued furnace skill XP for this owner (all furnaces): <white>{xp}<gray>. Separate from the furnace's withdrawable XP."
    observed: "<gray>Observed over about the last {seconds}s: <white>{smelts} completed smelts, {fuel} fuel items consumed, {outputs} output items processed; {yield} yield bonus items triggered."
    speed-preview: "<gray>Expected speed multiplier with this upgrade: <white>{current}× → {next}×<gray>."
    yield-preview: "<gray>Expected yield-bonus chance with this upgrade: <white>{current} → {next}<gray>."
  value:
