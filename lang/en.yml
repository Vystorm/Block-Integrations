# BlockIntegrations – English texts (MiniMessage; {placeholders} are filled in by the plugin).
# This file is never overwritten. Missing keys fall back to the version bundled in the jar.
# To add a language, copy this file to e.g. fr.yml in the same folder, translate it and run /bi reload.

general:
  no-permission: "<red>You don't have permission to do that."
  reloaded: "<green>BlockIntegrations has been reloaded."
  players-only: "<red>This command can only be used by players."
  settings-unavailable: "<red>These settings are not available."

menu:
  title: "Blocks & Upgrades"
  description: "Block combos, attack towers and upgradable furnaces"

guide:
  title: "Blocks & Upgrades"
  body:
    - "Furnaces, towers and block combos are managed directly at the structure itself."
    - "Sneak and right-click the matching block to open its upgrades."
    - "Block combos: sneak + right-click the top function block."
    - "Attack towers: sneak + right-click the tower head."
    - "Upgradable furnaces: sneak + right-click the furnace."
  combos:
    label: "Block combos"
    tooltip: "Structures, upgrade paths and heal block"
  towers:
    label: "Attack towers"
    tooltip: "Tower builds, upgrades and loot chest"
  furnaces:
    label: "Upgradable furnaces"
    tooltip: "Ownership, skill XP and upgrade paths"
  settings:
    label: "⚙ Server settings"
    tooltip: "Radii, launchers, combos, towers and furnaces (admin)"

status:
  line: "<green>BlockIntegrations <gray>- Towers: <white>{towers} <gray>| Attacks: <white>{attacks} <gray>| Cycles: <white>{cycles} <gray>| Tower max: <white>{tower_max} <gray>| Furnace max: <white>{furnace_max} <gray>| Combos: <white>{combos} <gray>| Combo max: <white>{combo_max} <gray>| Sorter/vacuum/launcher/booster/float lift/heal block/furnaces active"
  next: "<gray>Next: "
  furnaces: "<gray>Upgraded furnaces on the server: <white>{furnaces}"
  towers-button: "Towers"
  towers-hover: "Click: list all towers with their location"
  settings-button: "Server settings"
  settings-hover: "Click: open the settings"

chat:
  upgrades: "Upgrades"
  upgrades-hover: "Click: open the upgrades"
  location: " <gray>Location: "
  too-far:
    combo: "<yellow>You are too far away from this block combo."
    tower: "<yellow>You are too far away from this tower."
    furnace: "<yellow>You are too far away from this furnace."

sorter:
  success: "<green>Sorted {moved} items into {chests} chest(s)."
  nothing: "<gray>No matching pre-sorted chest found nearby."

sort-locks:
