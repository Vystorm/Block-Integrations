    cooldown: '<yellow>Votre chaîne se recharge : <white>{seconds}</white> Par.'
    blocked: '<red>{name} est bloqué: <gray>les deux blocs au-dessus doivent être libres.'
    arrived: <light_purple>Détruites <white>{name}</white>.
    not-yours: <red>Seul le propriétaire de cette chaîne peut le faire.
    usage: '<yellow>Utilisation: /bi warppads list | share NAME | unshare NAME'
