    header: '<gold>Vos combos de blocs <gray>({count}):'
    empty: <gray>Vous n'avez pas encore construit de combos de blocs. /bi combos montre comment.
    entry-here: <gray>• {name} <gray>| {x} {y} {z} | {blocks} m loin
    entry-elsewhere: <gray>• {name} <gray>| {world} {x} {y} {z}
