  brew-upgrade: Moderniser le stand de brassage
  name:
    brewing_stand: Support de brassage
    campfire: Feu de camp
    soul_campfire: Feu de camp de l'âme
  upgrade:
    extra: Effet supplémentaire aléatoire
    strength: Résistance à la potion
    duration: Durée de l'effet
    speed: Vitesse de traitement
    fuel: Efficacité énergétique de la brasserie
    yield: Résultats supplémentaires cuits
  description: 'Chaque niveau : +12% vitesse; combustible brasseur +10%; possibilité de bonus de feu de camp +2.5%. Les ingrédients
    et recettes normaux s''appliquent toujours.'
  level: '{upgrade}: niveau {level}/{max}'
  guide-title: Brewing stands & feux de camp
  guide:
  - Faites un clic droit sur un brasseur ou sur un feu de camp pour ouvrir ses améliorations. Les blocs non détenus existants
    sont réclamés lors de la première utilisation.
  - 'Brewing stands: brassage plus rapide et plus d''opérations de brassage par poudre d''incendie. Feux de camp: cuisson
    plus rapide et une chance pour un résultat supplémentaire.'
  - 'Jusqu''à 10 niveaux: 2.2x vitesse, 2x combustible brasseur et 25% rendement supplémentaire feu de camp. Chaque niveau
    coûte 100 × nouveau niveau carré XP points par défaut.'
  - Seul le propriétaire ou un administrateur autorisé peut mettre à niveau, dans 8 blocs. L'utilisation normale reste disponible
    pour les autres joueurs.
  - La propriété et les mises à niveau restent sur le poste de travail abandonné. Les feux de camp nécessitent Silk Touch;
    les gouttes ordinaires de charbon et de charbon ne peuvent pas être améliorées.
  - Les mises à niveau s'appliquent aux nouvelles opérations. Ils n'ajoutent pas de remboursements d'ingrédients ni de recettes
    de potion.
