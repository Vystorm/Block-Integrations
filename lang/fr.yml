  sorter:
    name: Trieur d'inventaire
    structure: Plaque de pression légère (or) sur tout bloc de construction en cuivre
  vacuum:
    name: Poste sous vide
    structure: plaque de pression (fer) lourde sur tout bloc de construction en cuivre
  launcher:
    name: Lanceur directionnel
    structure: bloc slime sur un bloc de pierre rouge; optionnellement un 3×3 champ de boue autour du centre
  booster:
    name: Booster Sprint
    structure: glace, banquise ou glace bleue sur un bloc de pierre rouge
  float-launcher:
    name: Soulève-fuite
    structure: terre cuite blanche sur un bloc de construction en cuivre sur un bloc de pierre rouge
  heal:
    name: Bloc de guérison
    structure: Bloc de miel sur un bloc de pierre rouge
  harvester:
    name: Harvester
    structure: composteur sur une balle de foin
  warp-pad:
    name: Plaque de distorsion
    structure: lodestone sur les pleurs obsidiens
    unnamed: Pad {x} {y} {z}
    limit: <red>Vous possédez déjà le maximum de <white>{max}</white> Des plaquettes de distorsion. <gray>D'abord casse un
      des tiens.
    disabled: <red>Les tampons de distorsion sont désactivés sur ce serveur.
    no-access: <red>Vous n'êtes pas autorisé à utiliser ce tapis de distorsion. <gray>Son propriétaire peut le partager avec
      vous.
