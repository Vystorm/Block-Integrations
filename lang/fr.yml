        <gray>{player} peuvent voyager sur votre ou vos tapis de chaîne {pads}.
        <yellow>Cliquez sur : récupérer l'accès
      lore-not-shared: |-
        <gray>Laissez {player} voyager sur votre tapis de chaîne {pads}.
        <yellow>Cliquez sur: partager
