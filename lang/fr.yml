furnace:
  name:
    furnace: Fourneau
    blast-furnace: Four à éclats
    smoker: Fumer
  guide:
    intro:
    - <gold><bold>Fours à haut rendement
    - '<gray>Appui : <white>four, haut fourneau et fumeur<gray>.'
    - <gray>Le joueur qui le place devient son propriétaire fixe. Les fours existants sont réclamés avec sneak + clic droit.
    - <gray>Avec Vystorm Compétences installées, la fusion automatique alimentée par trémie donne au propriétaire des compétences
      de fusion/cuisson XP et utilise les capacités de fusion du propriétaire.
    - <gray>Vanille XP collectée pendant que le four fonctionne peut être retirée dans le menu du four avec "Retirer stocké
      XP".
    paths: '<gray>Améliorer les chemins jusqu''au niveau {max}: <white>vitesse de fusion, efficacité énergétique, rendement
      bonus et fusion multiple<gray>.'
    outro:
    - <gray>Le XP boost a au maximum <white>5 niveaux <gray>et augmente la vanille entreposée XP ainsi que les compétences
      de fusion/cuisson XP (Vystorm Compétences).
    - <gray>Chaque niveau multismelt traite un élément supplémentaire dans le même cycle de fusion et lui accorde le four
      et la compétence XP.
  placed: '<green>Ce {name} vous appartient maintenant de façon permanente. <gray>Sneak + clic droit pour ouvrir les mises
    à niveau. '
  no-use: <red>Vous n'êtes pas autorisé à utiliser des fours graduables.
  claimed: <green>Furnace a revendiqué et lié en permanence à votre profil de compétence.
  owned-by: <red>Ce four appartient en permanence à <white>{owner}<red>.
  unknown-owner: Inconnu
  gone: <red>Le four n'existe plus.
  no-upgrade-permission: <red>Vous n'êtes pas autorisé à améliorer les fours.
  maxed: <yellow>Ce chemin de mise à niveau du four est déjà dépassé.
  no-owner: <red>Ce four n'a pas de propriétaire fixe.
  only-owner: <red>Seul le propriétaire fixe peut retirer le XP stocké.
  no-xp: <yellow>Ce four n'a pas encore enregistré un point complet de XP.
  withdraw-failed: <red>Le four XP n'a pas pu être retiré.
  withdrawn: <green>Vous vous êtes retiré <yellow>{xp} XP points <green>des {name}.
