# Français — UTF-8. Keep keys, placeholders and formatting tokens unchanged.
general:
  no-permission: <red>Tu n'as pas la permission de faire ça.
  reloaded: <green>BlockIntegrations a été rechargé.
  players-only: <red>Cette commande ne peut être utilisée que par les joueurs.
  settings-unavailable: <red>Ces paramètres ne sont pas disponibles.
menu:
  title: Blocs et mises à jour
  description: Combos de blocs, tours d'attaque et fours reclassables
guide:
  title: Blocs et mises à jour
  body:
  - Les fours, tours et combos sont gérés directement à la structure elle-même.
  - Faites un clic droit sur le bloc correspondant pour ouvrir ses mises à niveau.
  - 'Combos de bloc: sneak + clic droit sur le bloc de fonction supérieur.'
  - 'Tours d''attaque: sneak + clic droit sur la tête de tour.'
  - 'Fours reclassables : sneak + clic droit sur le four.'
  combos:
    label: Combos bloc
    tooltip: Structures, chemins de mise à niveau et bloc de guérison
  towers:
    label: Tours d'attaque
    tooltip: Constructions de tours, améliorations et coffre à butin
  furnaces:
    label: Fours à haut rendement
    tooltip: Propriété, compétences XP et chemins de mise à niveau
  settings:
    label: ⚙ Paramètres du serveur
    tooltip: Radis, lanceurs, combos, tours et fours (admin)
status:
