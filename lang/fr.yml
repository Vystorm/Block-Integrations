  need-xp: Vous n'avez pas assez de XP points pour cette mise à niveau.
  upgraded: Poste de travail amélioré.
trap:
  wait-remove: Attendez le temps de récupération actuel avant de vous désinscrire.
  title: Pièges
  status: '{type} · {mode} · temps de récupération {seconds} secondes'
  auto: Automatique
  manual: Bouton seulement
  toggle: Basculer le déclenchement automatique
  change-cooldown: Commutateur 10 / 15 secondes
  remove: Déregistrer le piège
  limit: Maximum 32 pièges par lecteur, 2048 par serveur; la nouvelle inscription est désactivée après une panne de lecture
    de stockage.
  denied: Ce piège appartient à quelqu'un d'autre ou est dans une région protégée.
  registered: 'Trap enregistré: {mode}, {seconds} deuxième période de récupération. Cliquez sur le bouton pour les paramètres.'
  cooldown: Piège prêt en {seconds} secondes.
  no-target: Pas de monstre à portée.
  guide:
  - Construire un 3×3 cadre obsidien (huit blocs) autour d'un piston (jeune), d'un bloc de fer (spikes) ou d'un bloc de miel
    (lent).
  - 'Piège à élingues : bloc slime dans le cadre obsidien avec exactement un bouton avant. Planchers/plafonds flottant loin
    du bouton; murs flottant vers l''avant et vers le haut.'
  - Pointez le piston vers la direction de lancement. Monter sur les planchers, les murs ou les plafonds.
  - Joindre un bouton à l'avant d'un bloc obsidien. Premier clic droit enregistre le piège avec déclenchement automatique
    activé.
  - 'Bouton : feu manuellement. Appuyez sur le bouton "Sneak-right-click" : choisissez le mode automatique et une seconde
    récupération 10/15. Les deux modes partagent le même temps de récupération.'
  - 'Superficie: 3×3 large, prolongeant 3 blocs en avant, avec ligne de vue. Seulement des monstres hostiles; aucun joueur
    ou animal de compagnie.'
  - Les araignées infligent 6 dégâts par défaut; le goudron ralentit pendant 5 secondes. Les deux modes exigent une cible
    admissible.
  - Le cadre manquant/bouton arrête le piège. L'enlèvement du noyau l'enregistre après le temps de récupération. Les morceaux
    déchargés restent déchargés.
