    <white>{combo_max} <gray>Sorter/vacuum/launcher/booster/lifting à flot/bloc sanitaire/fournaises actives'
  next: '<gray>Suivant : '
  furnaces: '<gray>Fours améliorés sur le serveur : <white>{furnaces}'
