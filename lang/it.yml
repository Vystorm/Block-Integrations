workstation:
  potion-description: 'Effetto supplementare: 5 gradi, +1% possibilità ciascuno per un effetto positivo casuale (I, 30s).
    Forza: 10 gradi, +10% possibilità ciascuno per +1 livello di effetto. Durata: 10 gradi, +25 ciascuno, esclude gli effetti
    istantanei. Un rotolo per bottiglia; ulteriore preparazione non può ripiegare.'
  brew-use: Utilizzare stand di produzione
  brew-upgrade: Stand di produzione di aggiornamento
  name:
    brewing_stand: Cavalletto di allevamento
    campfire: Fuoco di campo
    soul_campfire: Il fuoco dell'anima
  upgrade:
    extra: Effetto extra casuale
    strength: Forza di pozione
    duration: Durata dell'effetto
    speed: Velocità di lavorazione
    fuel: Efficienza del combustibile
    yield: Risultato extra cotto
  description: 'Ogni livello: +12% velocità; carburante per la produzione +10%; possibilità di bonus per il fuoco +2.5%. Gli
    ingredienti e le ricette normali si applicano ancora.'
  level: '{upgrade}: livello {level}/{max}'
  guide-title: Brewing stand & campfires
  guide:
  - Sneak-right-click a uno stand di birra o a un fuoco di campo per aprire i suoi aggiornamenti. I blocchi esistenti sono
    rivendicati al primo utilizzo.
  - 'Brewing stand: più veloce produzione e più operazioni di produzione per polvere di blaze. Campfires: cottura più veloce
    e possibilità di un risultato aggiuntivo.'
  - 'Fino a 10 livelli: 2.2x velocità, 2x carburante per la produzione di birra e 25% rendimento extra del fuoco. Ogni livello
    costa 100 × nuovo livello piazzato XP punti per impostazione predefinita.'
  - Solo il proprietario o un amministratore autorizzato può aggiornare, entro 8 blocchi. L'uso normale rimane disponibile
    per altri giocatori.
  - La proprietà e gli aggiornamenti rimangono sull'elemento di workstation caduto. Gli incendi richiedono il tocco di seta;
    le gocce ordinarie di carbone/cromo non possono portare aggiornamenti.
  - Gli aggiornamenti si applicano alle operazioni appena avviate. Non aggiungono i rimborsi degli ingredienti o cambiano
    le ricette di pozione.
  unavailable: La postazione di lavoro non è disponibile, disattivata, troppo lontana, o non può essere salvata.
  not-owner: Questa stazione di lavoro appartiene ad un altro giocatore.
  denied: Non si può aggiornare questa workstation.
  changed: Questa offerta di aggiornamento è cambiata. Riaprire il menu della workstation.
  need-xp: Non hai abbastanza XP punti per questo aggiornamento.
  upgraded: Workstation potenziato.
trap:
  wait-remove: Attendere il tempo di recupero corrente prima di non registrazione.
  title: Trappola
  status: '{type} · {mode} · tempo di recupero {seconds} secondi'
  auto: Automatico
  manual: Pulsante solo
  toggle: Attivazione automatica Toggle
  change-cooldown: Interruttore 10 / 15 secondi
  remove: Trappola irregolare
  limit: Massimo 32 trappole per giocatore, 2048 per server; la nuova registrazione è disabilitata dopo un errore di lettura
    di archiviazione.
  denied: Questa trappola appartiene a qualcun altro o è in una regione protetta.
  registered: 'Trappola registrata: {mode}, {seconds} secondo tempo di recupero. Sneak-right-click sul pulsante per le impostazioni.'
  cooldown: Trappola pronta in {seconds} secondi.
  no-target: Nessun mostro idoneo nella gamma.
  guide:
  - Costruisci un 3×3 cornice obsidian (otto blocchi) intorno a un pistone (crescita), blocco di ferro (spikes) o blocco di
    miele (slow).
  - 'Sling trap: blocco slime nella cornice obsidian con esattamente un pulsante anteriore. Pavimenti/ceilings fling away
    dal pulsante; pareti fling in avanti e in alto.'
  - Puntare il pistone verso la direzione di lancio. Montare su pavimenti, pareti o soffitti.
  - Collegare un pulsante alla parte anteriore di un blocco cornice ossidiana. Il primo tasto destro del mouse registra la
    trappola con attivazione automatica abilitata.
  - 'Pulsante: fuoco manualmente. Pulsante Sneak-right-click: scegliere modalità automatica e un 10/15 secondo tempo di recupero.
    Entrambe le modalità condividono lo stesso tempo di recupero.'
  - 'Area: 3×3 larghezza, che estende 3 blocchi in avanti, con linea di vista. Solo mostri ostili; nessun giocatore o animale
    domestico.'
  - Spikes affrontare 6 danni per impostazione predefinita; tar rallenta per 5 secondi. Entrambe le modalità richiedono un
    bersaglio idoneo.
  - Struttura mancante / pulsante ferma la trappola. Rimozione del nucleo non registra dopo il tempo di recupero. I pezzi
    scaricati rimangono scaricati.
  type:
    sling: Trappola di slittamento
    throw: Trappola di lancio
    spikes: Trappola Spike
    tar: Trappola di tartaruga
