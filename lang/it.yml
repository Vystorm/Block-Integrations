  items-cleared: <gray>Tutte le serrature di tipo dell'elemento di selezione sono state cancellate.
  usage: '<yellow>Utilizzo: /bi sortlock list|clear|slot|item|items|clearitems (i numeri di slot sono le slot interne 9–35).'
  invalid: <red>Scegliere una slot interna di main-inventory da 9 a 35, o utilizzare la lista / chiaro.
  list-empty: <gray>Non sono bloccate le slot dell'inventario principale. I numeri di fessura usano la numerazione interna
