# Italiano — UTF-8. Keep keys, placeholders and formatting tokens unchanged.
general:
  no-permission: <red>Non hai il permesso di farlo.
  reloaded: <green>BlockIntegrations è stato ricaricato.
  players-only: <red>Questo comando può essere utilizzato solo dai giocatori.
  settings-unavailable: <red>Queste impostazioni non sono disponibili.
menu:
  title: Blocchi e aggiornamenti
  description: Blocco combo, torri di attacco e forni aggiornabili
guide:
  title: Blocchi e aggiornamenti
  body:
  - I forni, le torri e i combo dei blocchi sono gestiti direttamente alla struttura stessa.
  - Sneak e fare clic con il pulsante destro del mouse sul blocco corrispondente per aprire i suoi aggiornamenti.
  - 'Blocco combo: sneak + fare clic con il pulsante destro del mouse sul blocco funzione superiore.'
  - 'Torri d''attacco: sneak + click destro sulla testa della torre.'
  - 'Forni aggiornabili: sneak + click destro del mouse sul forno.'
  combos:
    label: Blocco combo
    tooltip: Strutture, percorsi di aggiornamento e blocco di guarigione
  towers:
    label: Torri d'attacco
    tooltip: Torre costruisce, potenziamenti e bottino
  furnaces:
    label: Forni aggiornabili
    tooltip: Proprietà, abilità XP e percorsi di aggiornamento
  settings:
    label: ⚙ Impostazioni del server
    tooltip: Radii, lanciatori, combo, torri e forni (admin)
status:
  line: '<green>BlockIntegrations <gray>- Torri: <white>{towers} <gray>| Attacco: <white>{attacks} <gray>Cicli: <white>{cycles}
    <gray>| Torre max: <white>{tower_max} <gray>| Furnace max: <white>{furnace_max} <gray>| Combos: <white>{combos} <gray>|
    Combo max: <white>{combo_max} <gray>| Sorter/vacuum/launcher/booster/float lift/heal block/furnacs active'
  next: '<gray>Il prossimo: '
  furnaces: '<gray>Fornaci potenziate sul server: <white>{furnaces}'
  towers-button: Torri
  towers-hover: 'Clicca: elenca tutte le torri con la loro posizione'
  settings-button: Impostazioni del server
  settings-hover: 'Clicca: apri le impostazioni'
chat:
  upgrades: Aggiornamenti
  upgrades-hover: 'Clicca: apri gli aggiornamenti'
  location: ' <gray>Posizione: '
  too-far:
    combo: <yellow>Sei troppo lontano da questa combo del blocco.
    tower: <yellow>Sei troppo lontano da questa torre.
    furnace: <yellow>Sei troppo lontano da questo forno.
sorter:
  success: <green>Ordinato {moved} articoli in {chests} baule(i).
  nothing: <gray>Nessun baule pre-scelto corrispondente trovato nelle vicinanze.
sort-locks:
  hold-item: <gray>Tenere un elemento nella mano principale prima.
