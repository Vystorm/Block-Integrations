  list: '<gray>slot di inventario principali bloccati (interno Minecraft numerazione 9-35): <white>{slots}'
  locked: <green>slot Main-inventory {slot} è ora bloccato da smistamento.
  unlocked: <green>slot Main-inventory {slot} non è più bloccato dalla selezione.
  cleared: <green>Tutte le tue chiusure personali sono state cancellate.
chest-priority:
  usage: '<yellow>Utilizzo: /bi chestpriority add|overflow|remove|list|clear. Per add/overflow/remove, guardare un baule caricato
    all''interno 6 blocks.'
  look-at-chest: <red>Guarda un baule caricato entro 6 blocchi prima.
  limit: <red>È possibile salvare al massimo 8 posizioni toraciche preferite e 1 posizione di troppopieno.
  add: '<green>Aggiunto baule preferito: {chest}'
  overflow: '<green>Impostare il torace overflow: {chest}'
  remove: '<green>Preferenze toraciche eliminate: {chest}'
  cleared: <green>Hai eliminato le tue priorità personali sul baule.
  list-empty: <gray>Non hai priorità sul baule personale.
  list: '<gray>Torace preferito (in ordine): <white>{chests}<gray> | Overflow (ultimo, solo articoli corrispondenti): <white>{overflow}'
vacuum:
  chests: <green>Aspirato {moved} ha lasciato cadere oggetti in {chests} baule(i).
  inventory: <green>Aspirato {moved} ha lasciato gli articoli nel vostro inventario.
  nothing: <gray>Nessuna corrispondenza oggetti abbandonati sottovuoto.
