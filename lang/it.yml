  no-use: <red>Non è consentito usare combo di blocco.
  no-upgrade: <red>Non è consentito aggiornare combo blocco.
  incomplete: <red>La combo del blocco non è più completa.
  dialog:
    title: '{name} Aggiornamenti'
    header: '{name} | livello massimo {max}'
    line: '{upgrade}: {level}/{max} | {value} | {cost} XP'
    line-max: '{upgrade}: {level}/{max} | {value} | MAX'
