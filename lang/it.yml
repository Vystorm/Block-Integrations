      take-all: Prendere tutto ({stored} XP)
      owner-only: <gray>Solo il proprietario può prendere il XP immagazzinato.
  slime-field:
    name: Slime Field 3×3
    info: Aggiornamenti condivisi per tutti i nove blocchi slime. Il blocco centrale mantiene gli aggiornamenti quando è rotto.
  guide:
    header: <gold><bold>Blocco combo</bold></gold> <gray>- Aggiornamenti
    open: <gray>Sneak + fare clic con il pulsante destro del mouse sul blocco funzione superiore per aprire il menu di aggiornamento.
    structure: '{name}<gray>: {structure}'
    paths: <gray>A seconda della struttura, dell'intervallo, della potenza, della durata dell'effetto e del tempo di recupero
      può essere aggiornato fino a livello <white>{max}<gray>.
    float: <gray>L'ascensore galleggiante dà già cinque secondi di Levitazione I al livello 0.
    heal: '<gray>Il blocco guarisce lentamente i giocatori all''interno della sua aura. Dopo aver subito danni attende {seconds}
      secondi; distanza minima: <white>{distance} blocchi<gray>.'
    warp: '<gray>Warp pad: stand on the lodestone e sneak per scegliere una destinazione. Condividi i tuoi pad con gli amici
      attraverso il menu del giocatore o /bi warppads.'
    xp: '<gray>XP collettore: raccoglie orbs che nessun giocatore è in piedi accanto; prendere il XP nel suo menu. Romperlo
      rovescia i XP memorizzati.'
  heal-too-close: '<red>Il prossimo blocco di guarigione è troppo vicino. <gray>Distanza minima: <white>{distance} blocchi<gray>.'
  claimed: <gray>Questo blocco combo non aveva ancora proprietario e ora appartiene a voi (è elencato nella vostra pagina
    web).
  claim-denied: <gray>Questa combo non ha ancora un proprietario. Solo qualcuno che può costruire qui può prenderlo; fino
