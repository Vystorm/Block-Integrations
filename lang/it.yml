    base: base di base
    lower-base: base inferiore
    pedestal: piedistallo
    foundation: fondazione
    ring: anello
combo:
  mine:
    header: '<gold>Il tuo blocco combo <gray>({count}):'
    empty: <gray>Non hai ancora costruito alcun combo. /bi combos mostra come.
    entry-here: <gray>• {name} <gray>{x} {y} {z} | {blocks} m distanza
    entry-elsewhere: <gray>• {name} <gray>| {world} {x} {y} {z}
    more: <gray>... e {count} di più.
    hint: <dark_gray>Combos costruito prima 2.20.0 si presenta qui una volta li avete utilizzati.
  sorter:
    name: Sorter dell'inventario
    structure: piastra di pressione leggera ponderata (oro) su qualsiasi blocco edificio in rame
  vacuum:
    name: Articolo vuoto
    structure: piastra di pressione pesante ponderata (ron) su qualsiasi blocco edificio in rame
  launcher:
    name: Launcher direzionale
    structure: blocco sottile su un blocco in pietra rossa; opzionalmente un 3×3 campo sottile intorno al centro
  booster:
    name: Sprint Booster
    structure: ghiaccio, ghiaccio imballato o ghiaccio blu su un blocco di pietre rosse
  float-launcher:
    name: Ascensore galleggiante
    structure: terracotta bianca su un blocco di rame su un blocco di pietra rossa
  heal:
    name: Blocco del tallone
    structure: blocco di miele su un blocco di pietra rossa
  harvester:
    name: Harvester
    structure: composto su una balla di fieno
  warp-pad:
    name: Rivestimento
    structure: lodestone su pianto obsidian
    unnamed: Pad {x} {y} {z}
    limit: <red>Hai già il massimo di <white>{max}</white> Pacchetti di curvatura. <gray>Prima rompi uno dei tuoi.
    disabled: <red>I cuscinetti di curvatura sono spenti su questo server.
    no-access: <red>Non è consentito usare questo cuscinetto di curvatura. <gray>Il suo proprietario può condividerlo con
      voi.
    no-destinations: <yellow>Nessun altro cuscinetto di curvatura che potete usare è dentro <white>{blocks}</white> blocchi
      in questo mondo. <gray>Costruire un secondo pad o chiedere ad un amico di condividere il loro.
    gone: <red>Quella curvatura e' sparita o incompleta.
    stand-on-pad: <yellow>In piedi sulla piattaforma di curvatura per viaggiare.
    too-far: <red>Quel pad è fuori portata (<white>{blocks}</white> blocchi). <gray>Aggiorna la distanza di questo pad.
    cooldown: '<yellow>La vostra curvatura sta ricaricando: <white>{seconds}</white> S.'
    blocked: '<red>{name} è bloccato: <gray>i due blocchi sopra di esso devono essere liberi.'
    arrived: <light_purple>Avvertito <white>{name}</white>.
    not-yours: <red>Solo il proprietario di questo cuscinetto di curvatura può farlo.
    usage: '<yellow>Utilizzo: /bi warppads list | share NAME | unshare NAME'
    dialog:
      name: '<gray>Nome: <white>{name}'
      use: <gray>In piedi sul pad e sgattaiolare per viaggiare. Condividi con <white>{guests}</white> giocatore(i).
      rename: Rinomina
      rename-tooltip: Dare a questo pad un nome per il menu di viaggio (solo proprietario)
    rename:
      title: Rinominare la guarnizione
      question: 'Nuovo nome (lettere, cifre, spazi):'
      invalid: <red>Quel nome e' vuoto o non valido. <gray>Utilizzare fino a {max} lettere, cifre e spazi.
      done: <green>Rinominato il cuscinetto Warp <white>{name}</white>.
    travel:
      title: Rivestimento
      body: '<gray>Da <white>{name}</white> <gray>| raggiungere <white>{blocks}</white> blocchi. Scegli la tua destinazione:'
      button: '{name} ({distance} m)'
      tooltip: '{owner} | {x} {y} {z}'
      own: Il tuo pad
      shared: Condividi da {owner}
    state:
      active: attivo
      incomplete: incompleto
      unloaded: non caricato
    list:
      header: '<light_purple>Le tue verruche <gray>({count}/{max}):'
      empty: '<gray>Non ancora. Costruire uno: lodestone su obsidian piangente.'
      entry: <gray>• <white>{name}</white> <gray>| raggiungere {blocks} blocchi | {state}
      guests: '<gray>Condividi con: <white>{players}'
      no-guests: <gray>Non condiviso con nessuno.
      hint: '<gray>Condividi con un giocatore: sneak + click destro → Cuscinetti, o /bi warppads share NAME.'
    share:
      added: <green>{player} può ora utilizzare tutti i cuscinetti di curvatura.
      removed: <yellow>{player} non può più utilizzare i cuscinetti di curvatura.
      unchanged: <gray>Niente è cambiato per {player}.
      full: <red>Condividi già i tuoi pad con {max} giocatori.
      self: <red>I tuoi pad sono sempre tuoi.
      unknown: <red>Nessun giocatore di nome {player} ha giocato qui.
    menu:
      shared: '<light_purple>Rilievi: condivisi'
      not-shared: '<gray>Rilievi: non condivisi'
      lore-shared: |-
        <gray>{player} può viaggiare sul tuo pad {pads} curvatura.
        <yellow>Fare clic su: prendere l'accesso indietro
      lore-not-shared: |-
        <gray>Lasciate {player} viaggiare sul vostro pad {pads} curvatura.
        <yellow>Fare clic su: condivisione
  xp-collector:
    name: XP collezionista
    structure: tavolo incantevole su un blocco lapis
    owner-only: <red>Solo il proprietario di questo collezionista XP può prendere il suo XP.
    empty: <gray>Il collezionista XP è vuoto.
    taken: '<green>Hai preso <white>{points}</white> XP punti. <gray>Sinistra nel collettore: {left}.'
    dialog:
