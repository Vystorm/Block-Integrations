furnace:
  name:
    furnace: Fornace
    blast-furnace: Furnace
    smoker: Fumo
  guide:
    intro:
    - <gold><bold>Forni aggiornabili
    - '<gray>Supportato: <white>forno, altoforno e fumatore<gray>.'
    - <gray>Il giocatore che mette uno diventa il suo proprietario fisso. I forni esistenti sono rivendicati con sneak + click
      destro.
    - <gray>Con Vystorm Competenze installate, fusione automatica a tramoggia dà al proprietario smellare/cottura abilità
      XP e utilizza le capacità di fusione del proprietario.
    - <gray>Vanilla XP raccolti mentre le piste del forno possono essere ritirate nel menu forno con "Ritiro memorizzato XP".
    paths: '<gray>Percorsi di aggiornamento fino al livello {max}: <white>velocità di fusione, efficienza del carburante,
      rendimento bonus e multismelt<gray>.'
    outro:
    - <gray>La spinta XP ha al massimo <white>5 livelli <gray>e aumenta la vaniglia conservata XP così come la fusione/cottura
      abilità XP (Vystorm Skills).
    - <gray>Ogni livello multismelt elabora un elemento aggiuntivo nello stesso ciclo di fusione e garantisce forno e abilità
      XP per esso.
  placed: '<green>Questo {name} ora appartiene permanentemente a voi. <gray>Sneak + click destro per aprire gli aggiornamenti. '
  no-use: <red>Non è consentito utilizzare forni aggiornabili.
  claimed: <green>Furnace rivendicato e permanentemente legato al tuo profilo di abilità.
  owned-by: <red>Questo forno appartiene permanentemente <white>{owner}<red>.
  unknown-owner: Sconosciuto
  gone: <red>Il forno non esiste più.
  no-upgrade-permission: <red>Non è consentito aggiornare i forni.
  maxed: <yellow>Questo percorso di aggiornamento del forno è già maxed out.
  no-owner: <red>Questo forno non ha un proprietario fisso.
  only-owner: <red>Solo il proprietario fisso può ritirare il XP immagazzinato.
  no-xp: <yellow>Questo forno non ha ancora conservato un punto completo XP.
  withdraw-failed: <red>Il forno XP non poteva essere ritirato.
  withdrawn: <green>Ti sei ritirato <yellow>{xp} XP punti <green>dal {name}.
  dialog:
