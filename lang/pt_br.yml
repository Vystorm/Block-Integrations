  invalid: <red>Escolha uma ranhura interna entre 9 e 35, ou use lista/limpa.
  list-empty: <gray>Nenhuma slot-inventário principal está trancada. Números de fenda usam Minecraft números internos 9-35.
  list: '<gray>slots de inventário principal bloqueados, Minecraft números internos 9-35: <white>{slots}'
  locked: <green>A ranhura principal do inventário {slot} está bloqueada da triagem.
  unlocked: <green>A slot principal {slot} não está mais bloqueada.
  cleared: <green>Todas as suas travas pessoais foram limpas.
chest-priority:
  usage: '<yellow>Uso: /bi chestpriority add|overflow|remove|list|clear. Pelo add/overflow/remove, Olhe para um baú carregado
