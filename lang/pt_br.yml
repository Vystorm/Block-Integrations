combo:
  mine:
    header: '<gold>Suas combinações de blocos <gray>({count}):'
    empty: <gray>Você ainda não construiu nenhuma combinação de blocos. /bi combos mostra como.
    entry-here: <gray>• {name} <gray>{x} {y} {z} {blocks} m de distância
    entry-elsewhere: <gray>• {name} <gray>| {world} {x} {y} {z}
    more: <gray>... e {count} mais.
    hint: <dark_gray>Combos construídos antes de 2.20.0 aparecer aqui depois de usá-los.
  sorter:
    name: Separador de Inventário
    structure: Placa de pressão leve ponderada (ouro) em qualquer bloco de cobre completo
  vacuum:
    name: Item Vacuum
    structure: Placa de pressão pesada ponderada (ferro) em qualquer bloco de construção de cobre
  launcher:
    name: Lançador direcional
    structure: Bloco de lodo em um bloco de pedra vermelha, opcionalmente um 3×3 lodo ao redor do centro
  booster:
    name: Sprint Booster
    structure: Gelo, gelo ou gelo azul em um bloco de pedra vermelha
  float-launcher:
    name: Elevador Flutuante
    structure: Terracota branca em um bloco de cobre em um bloco de pedra vermelha
  heal:
    name: Bloco de cura
    structure: Bloco de mel em um bloco de pedra vermelha
  harvester:
    name: Colheitadeira
    structure: Adubo em um fardo de feno
  warp-pad:
    name: Dobra Pad
    structure: Lodestone em obsidiana chorando
    unnamed: Pad {x} {y} {z}
    limit: <red>Você já possui o máximo de <white>{max}</white> Padrões de dobra. <gray>Quebre um dos seus primeiro.
    disabled: <red>As almofadas de dobra estão desligadas neste servidor.
    no-access: <red>Você não pode usar esta plataforma de dobra. <gray>Seu dono pode compartilhar com você.
    no-destinations: <yellow>Nenhuma outra plataforma de dobra que você pode usar está dentro <white>{blocks}</white> blocos
      neste mundo. <gray>Construa um segundo bloco ou peça a um amigo para compartilhar o deles.
    gone: <red>Essa plataforma de dobra sumiu ou está incompleta.
    stand-on-pad: <yellow>Fique na plataforma de dobra para viajar.
    too-far: <red>Esse bloco está fora de alcance<white>{blocks}</white> Bloqueios). <gray>Aumente a distância deste bloco.
    cooldown: <yellow>Sua dobra está recarregando. <white>{seconds}</white> S.
    blocked: <red>{name} está bloqueado. <gray>Os dois quarteirões acima devem ser livres.
    arrived: <light_purple>Warped para <white>{name}</white>.
    not-yours: <red>Só o dono desta plataforma de dobra pode fazer isso.
    usage: '<yellow>Uso: /bi warppads list | share NAME | unshare NAME'
    dialog:
      name: '<gray>Nome: <white>{name}'
      use: <gray>Fique na almofada e fuja para viajar. Dividido com <white>{guests}</white> Jogador(es).
      rename: Renomear
      rename-tooltip: Dê a este bloco um nome para o menu de viagem
    rename:
      title: Renomeie a plataforma de dobra
      question: 'Nome novo (cartas, dígitos, espaços):'
      invalid: <red>Esse nome é vazio ou inválido. <gray>Use até {max} letras, dígitos e espaços.
      done: <green>Warp Pad renomeado para <white>{name}</white>.
    travel:
      title: Dobra Pad
      body: '<gray>De <white>{name}</white> <gray># Alcance <white>{blocks}</white> Blocos. Escolha seu destino:'
      button: '{name} ({distance} m)'
      tooltip: '{owner} | {x} {y} {z}'
      own: Seu apartamento
      shared: Compartilhado por {owner}
    state:
      active: ativo
      incomplete: incompleto
      unloaded: não carregado
    list:
      header: '<light_purple>Suas almofadas de dobra <gray>({count}/{max}):'
      empty: '<gray>Nenhum ainda. Construa um: Lodestone em obsidiano chorando.'
      entry: <gray>• <white>{name}</white> <gray>Alcance {blocks} blocos {state}
      guests: '<gray>Compartilhado com: <white>{players}'
      no-guests: <gray>Não compartilhado com ninguém.
      hint: '<gray>Compartilhe com um jogador: Sleak + clique com o botão direito → Blocos de dobra, ou /bi warppads share
        NAME.'
    share:
      added: <green>{player} agora podem usar todas as suas almofadas de dobra.
      removed: <yellow>{player} não podem mais usar suas plataformas de dobra.
      unchanged: <gray>Nada mudou para {player}.
      full: <red>Você já compartilha suas almofadas com {max} jogadores.
      self: <red>Suas próprias almofadas são sempre suas.
      unknown: <red>Nenhum jogador chamado {player} jogou aqui.
    menu:
      shared: '<light_purple>Dobradores: compartilhados'
      not-shared: '<gray>Dobradores: não compartilhados'
      lore-shared: |-
        <gray>{player} podem viajar em seus {pads} dobradores.
        <yellow>Clique: pegue o acesso de volta
      lore-not-shared: |-
        <gray>Deixe {player} viajar em suas {pads} almofadas de dobra.
        <yellow>Clique: compartilhe
  xp-collector:
    name: XP Colecionador
    structure: Mesa encantadora em um bloco de lápis
    owner-only: <red>Só o dono deste colecionador XP pode levar o seu XP.
    empty: <gray>O colecionador XP está vazio.
    taken: '<green>Você pegou <white>{points}</white> XP pontos. <gray>Esquerda no colecionador: {left}.'
