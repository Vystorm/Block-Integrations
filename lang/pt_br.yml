      take-all: Leve tudo ({stored} XP)
      owner-only: <gray>Só o dono pode levar os XP armazenados.
  slime-field:
    name: Slime Field 3×3
    info: Atualizações compartilhadas para os nove blocos de lodo. O bloco central mantém as atualizações quando está quebrado.
  guide:
    header: <gold><bold>Block combos</bold></gold> <gray>- Atualizações
    open: <gray>Sneak + botão direito do mouse no bloco de função superior para abrir o menu de atualização.
    structure: '{name}<gray>: {structure}'
