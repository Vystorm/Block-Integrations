    heal: '<gray>O bloco cura lentamente cura os jogadores dentro de sua aura. Depois de sofrer danos, espera {seconds} segundos,
      distância mínima: <white>{distance} quarteirões<gray>.'
    warp: '<gray>Dobra: levante-se na pedra e esgueira-se para escolher um destino. Compartilhe suas almofadas com amigos
      através do menu do jogador ou /bi warppads.'
    xp: '<gray>XP colecionadores: coleciona orbes que nenhum jogador está ao lado; pegue o XP em seu menu. Quebrando-o derrama
      o XP armazenado.'
  heal-too-close: '<red>O próximo bloco de cura está muito perto. <gray>Distância mínima: <white>{distance} quarteirões<gray>.'
  claimed: <gray>Este bloco combo ainda não tinha dono e agora pertence a você (está listado em sua página web).
  claim-denied: <gray>Este bloco ainda não tem dono. Só alguém que pode construir aqui pode assumir, até lá só administradores
