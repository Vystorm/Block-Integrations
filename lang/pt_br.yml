# Português (Brasil) — UTF-8. Keep keys, placeholders and formatting tokens unchanged.
general:
  no-permission: <red>Você não tem permissão para fazer isso.
  reloaded: <green>BlockIntegrations foram recarregados.
  players-only: <red>Este comando só pode ser usado por jogadores.
  settings-unavailable: <red>Essas configurações não estão disponíveis.
menu:
  title: Blocos e upgrades
  description: Combos de bloco, torres de ataque e fornalhas upgradáveis
guide:
  title: Blocos e upgrades
  body:
  - Fornos, torres e combinações de blocos são gerenciados diretamente na própria estrutura.
  - Clique com o botão direito do mouse no bloco correspondente para abrir suas atualizações.
  - 'Block combos: Sleak + botão direito do mouse no bloco de função superior.'
  - 'Torres de ataque: furtivo + clique com o botão direito na cabeça da torre.'
  - 'Fornos upgradáveis: Sleak + clique com o botão direito do mouse na fornalha.'
  combos:
    label: Block combos
    tooltip: Estruturas, melhorias de caminhos e bloqueio de cura
  towers:
    label: Torres de ataque
    tooltip: Torre constrói, melhoras e saquear baú
  furnaces:
    label: Fornos modernáveis
    tooltip: Propriedade, habilidade XP e caminhos de atualização
  settings:
    label: ⚙ Configurações do servidor
    tooltip: Radii, lançadores, combos, torres e fornos
status:
  line: "<green>BlockIntegrations <gray>- Torres: <white>{towers} <gray>| Ataques: <white>{attacks} <gray>| Ciclos: <white>{cycles} <gray>| Torre máx.: <white>{tower_max} <gray>| Fornalha máx.: <white>{furnace_max} <gray>| Combos: <white>{combos} <gray>| Combo máx.: <white>{combo_max}"
  switches-on: "<gray>Todas as funções estão ligadas."
  switches-off: "<gray>Desligado: <white>{features}"
  next: '<gray>Próximo: '
  furnaces: '<gray>Fornalhas melhoradas no servidor: <white>{furnaces}'
  towers-button: Torres
  towers-hover: 'Clique: listar todas as torres com sua localização'
  settings-button: Configurações do servidor
  settings-hover: 'Clique: abra as configurações'
chat:
  upgrades: Atualizações
  upgrades-hover: 'Clique: abra as atualizações'
  location: ' <gray>Localização: '
  too-far:
    combo: <yellow>Você está muito longe desta combinação de blocos.
    tower: <yellow>Você está muito longe desta torre.
    furnace: <yellow>Você está muito longe desta fornalha.
sorter:
  success: <green>Ordenado {moved} itens em {chests} baú(s).
  nothing: <gray>Nenhum baú pré-sortido encontrado por perto.
