furnace:
  name:
    furnace: Fornalha
    blast-furnace: Forno de explosão
    smoker: Fumador
  guide:
    intro:
    - <gold><bold>Fornos modernáveis
    - '<gray>Apoiado: <white>Forno, alto-forno e fumante<gray>.'
    - <gray>O jogador que coloca um se torna seu dono fixo. Fornos existentes são reivindicados com sneatch + botão direito.
    - <gray>Com Vystorm Skills instaladas, a fundição automática de tremonha dá ao proprietário a habilidade de fundição/cozimento
      XP e usa as habilidades de fundição do proprietário.
    - <gray>Vanilla XP coletadas enquanto o forno funciona pode ser retirado no menu da fornalha com "Retirar armazenado XP".
    paths: '<gray>Atualizar caminhos até o nível {max}: <white>Velocidade de fusão, eficiência de combustível, rendimento
      de bônus e multi-feitiço<gray>.'
    outro:
    - <gray>O impulso XP tem no máximo <white>5 níveis <gray>e aumenta a baunilha armazenada XP, bem como a habilidade de
      fundição/cozinha XP (Vystorm Skills).
    - <gray>Cada nível multirremetido processa um item adicional no mesmo ciclo de fundição e concede forno e habilidade XP
      para ele.
  placed: '<green>Este {name} agora pertence permanentemente a você. <gray>Sneak + botão direito para abrir as atualizações. '
  no-use: <red>Você não está autorizado a usar fornos upgradáveis.
  claimed: <green>Forno reivindicado e permanentemente ligado ao seu perfil de habilidade.
  owned-by: <red>Esta fornalha pertence permanentemente a <white>{owner}<red>.
  unknown-owner: Desconhecido
  gone: <red>O forno não existe mais.
  no-upgrade-permission: <red>Você não está autorizado a atualizar fornos.
  maxed: <yellow>Este caminho de atualização do forno já está no máximo.
  no-owner: <red>Este forno não tem dono fixo.
  only-owner: <red>Só o proprietário fixo pode retirar os XP armazenados.
  no-xp: <yellow>Este forno ainda não guardou um ponto de XP.
  withdraw-failed: <red>O forno XP não poderia ser retirado.
  withdrawn: <green>Você se retirou <yellow>{xp} XP pontos <green>dos {name}.
