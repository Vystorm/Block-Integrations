    extra: Efeito extra aleatório
    strength: Força da poção
    duration: Duração do efeito
    speed: Velocidade de processamento
    fuel: Eficiência do combustível de cerveja
    yield: Resultado extra cozido
  description: 'Cada nível: +12% velocidade; combustível de cerveja +10%; chance de bônus de fogueira +2.5%. Ingredientes
    e receitas normais ainda se aplicam.'
  level: '{upgrade}: nível {level}/{max}'
  guide-title: Cervejarias e fogueiras
  guide:
  - Clique com o botão direito de um carrinho de cerveja ou uma fogueira para abrir suas atualizações. Blocos inexistentes
    são reivindicados no primeiro uso.
  - 'Estandes de cerveja: mais rápido cervejeiro e mais operações de cerveja por pó de chama. Fogueiras: cozinhar mais rápido
    e uma chance para um resultado extra.'
  - 'Até 10 níveis: 2,2x de velocidade, 2x de combustível e 25% de rendimento de fogueira extra. Cada nível custa 100 × Novo
    nível ao quadrado XP pontos por padrão.'
  - Apenas o proprietário ou um administrador autorizado pode atualizar, dentro de 8 blocos. O uso normal permanece disponível
    para outros jogadores.
  - Proprietário e upgrades ficam na estação de trabalho. Fogos de acampamento requerem Silk Touch; gotas comuns de carvão/carvão
    não podem levar atualizações.
  - Atualizações se aplicam a operações recém iniciadas. Eles não adicionam reembolsos de ingredientes ou mudam receitas de
    poção.
  unavailable: A estação de trabalho está indisponível, desativada, muito longe, ou não pode ser salva.
  not-owner: Esta estação de trabalho pertence a outro jogador.
