  look-at-chest: <red>Olhe para um baú carregado dentro de 6 quarteirões primeiro.
  limit: <red>Você pode economizar no máximo 8 posições preferidas no baú e 1 posição de transbordamento.
  add: '<green>Adicionado baú preferido: {chest}'
  overflow: '<green>Coloque o baú transbordante: {chest}'
  remove: '<green>Preferência do baú removida: {chest}'
  cleared: <green>Limpei suas prioridades pessoais.
  list-empty: <gray>Você não tem prioridades pessoais no baú.
  list: '<gray>O que é isso? <white>{chests}<gray> Overflow (últimos itens correspondentes): <white>{overflow}'
