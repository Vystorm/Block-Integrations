  upgraded: Estação de trabalho atualizada.
trap:
  wait-remove: Espere pelo tempo de recuperação atual antes de não registrar.
  title: Armadilhas
  status: '{type} · {mode} · Tempo de recuperação {seconds} segundos'
  auto: Automático
  manual: Só o botão
  toggle: Alternar gatilho automático
  change-cooldown: Troque 10 / 15 segundos
  remove: Armadilha não registrada
  limit: No máximo 32 armadilhas por jogador, 2048 por servidor, novo registro é desativado após uma falha de leitura de armazenamento.
  denied: Esta armadilha pertence a outra pessoa ou está em uma região protegida.
  registered: 'Armadilha registrada: {mode}, {seconds} segundo tempo de recuperação. Sneak-direita-clique no botão para configurações.'
  cooldown: Armadilha pronta em {seconds} segundos.
  no-target: Nenhum monstro elegível ao alcance.
  guide:
  - Construa um 3×3 quadros obsidianas (oito blocos) em torno de um pistão (jogo), bloco de ferro (spikes) ou bloco de mel
    (lento).
  - 'Armadilha: bloco de lodo na moldura obsidiana com exatamente um botão frontal. Pisos e tetos se afastam do botão, paredes
    se movem para frente e para cima.'
  - Aponte o pistão para a direção de lançamento. Monte em pisos, paredes ou tetos.
  - Coloque um botão na frente de um bloco obsidiana. O primeiro clique direito registra a armadilha com o gatilho automático
    ativado.
  - 'Botão: atire manualmente. Botão de sneak-right-click: escolha o modo automático e um 10/15 segundo tempo de recuperação.
    Ambos os modos compartilham o mesmo tempo de recuperação.'
  - 'Área: 3×3 de largura, estendendo 3 blocos para frente, com linha de visão. Apenas monstros hostis, sem jogadores ou animais
    de estimação.'
  - Spikes lidam com 6 danos por padrão, alcatrão diminui por 5 segundos. Ambos os modos requerem um alvo elegível.
  - A armação/botão em falta pausa a armadilha. Removendo o núcleo não registra após o tempo de recuperação. Pedaços descarregados
    ficam descarregados.
