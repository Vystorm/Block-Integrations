  no-target: Никаких подходящих монстров.
  guide:
  - Построить 3×3 обсидиановых рам (восемь блоков) вокруг поршня (броска), железного блока (шипы) или медового блока (медленный).
  - 'Прядильная ловушка: блок слизи в обсидиановой раме с ровно одной передней кнопкой. Полы / потолки отскакивают от кнопки;
    стены отскакивают вперед и вверх.'
  - Направьте поршень в направлении запуска. Гора на этажах, стенах или потолках.
  - Прикрепите кнопку к передней части блока обсидиана. Первый правый клик регистрирует ловушку с включенным автоматическим
    запуском.
  - 'Кнопка: огонь вручную. Кнопка щелчка вправо: выберите автоматический режим и время восстановления 10/15. Оба режима имеют
    одинаковое время восстановления.'
  - 'Площадь: 3×Ширина 3, протяженностью 3 блоков вперед, с прямой видимости. Только враждебные монстры; никаких игроков или
    домашних животных.'
  - Спайки наносят 6 повреждений по умолчанию; смола замедляется на 5 секунду. Оба режима требуют подходящей цели.
  - Пропавшая рамка/кнопка останавливает ловушку. Удаление ядра не регистрирует его после восстановления. Незагруженные чанки
    остаются незагруженными.
