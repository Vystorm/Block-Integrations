    пищи и шанс на один дополнительный результат.'
  - 'До 10 уровней: 2.2x скорость, 2x пивоваренное топливо и 25% дополнительный костровый выход. Стоимость каждого уровня
    100 × Новый уровень по умолчанию составляет XP пунктов.'
