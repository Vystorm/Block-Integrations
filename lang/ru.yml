# Русский — UTF-8. Keep keys, placeholders and formatting tokens unchanged.
general:
  no-permission: <red>У тебя нет на это разрешения.
  reloaded: <green>Было перезагружено BlockIntegrations.
  players-only: <red>Эту команду могут использовать только игроки.
  settings-unavailable: <red>Эти настройки недоступны.
menu:
  title: Блоки и обновления
  description: Блок комбо, атакующие башни и модернизируемые печи
guide:
  title: Блоки и обновления
  body:
  - Печи, башни и блок-комбо управляются непосредственно в самой конструкции.
  - Присядьте и щелкните правой кнопкой мыши соответствующий блок, чтобы открыть его обновления.
  - 'Блок комбо: sneak + right-click верхний функциональный блок.'
  - 'Атакуйте башни: проприсесть + щелкните правой кнопкой мыши башню.'
  - 'Обновляемые печи: sneak + right-click печь.'
  combos:
    label: Блок комбо
    tooltip: Структуры, пути обновления и блок исцеления
  towers:
    label: Башни для атак
    tooltip: Башня строит, модернизирует и сундук
  furnaces:
    label: Модернизированные печи
    tooltip: Владение, мастерство XP и модернизация путей
  settings:
    label: ⚙ Настройки сервера
    tooltip: Радий, пусковые установки, комбо, башни и печи (админ)
status:
  line: '<green>BlockIntegrations <gray>- Башни: <white>{towers} <gray>Атаки: <white>{attacks} <gray>Циклы: <white>{cycles}
    <gray>Башня Макс: <white>{tower_max} <gray>Пушка Макс: <white>{furnace_max} <gray>Комбо: <white>{combos} <gray>Комбо макс:
    <white>{combo_max} <gray>Сортер/вакуум/пусковой механизм/бустер/плавучий подъемник/заживляющий блок/активные печи'
  next: '<gray>Следующий: '
  furnaces: '<gray>Улучшенных печей на сервере: <white>{furnaces}'
  towers-button: Башни
  towers-hover: 'Нажмите: список всех башен с их местоположением'
  settings-button: Настройки сервера
  settings-hover: 'Click: Откройте настройки'
chat:
  upgrades: модернизация
  upgrades-hover: 'Click: Откройте обновления'
  location: ' <gray>Местонахождение: '
  too-far:
    combo: <yellow>Вы слишком далеко от этого блока.
    tower: <yellow>Вы слишком далеко от этой башни.
    furnace: <yellow>Ты слишком далеко от этой печи.
sorter:
  success: <green>Сортировал {moved} предметов в {chests} сундук (сундуки).
  nothing: <gray>Не было найдено поблизости подходящей предварительно сортированной сундуке.
sort-locks:
  hold-item: <gray>Сначала держите предмет в главной руке.
  item-locked: '<gray>Сортировщик теперь хранит все элементы этого типа: '
  item-unlocked: '<gray>Сортировщик может переместить этот тип элемента снова: '
  items-empty: <gray>У вас нет типов предметов, заблокированных от сортировки.
  items-title: '<gray>Типы предметов, хранящиеся в сортировщике (все варианты, в каждом слоте):'
  items-cleared: <gray>Все замки вашего сортировщика были очищены.
  usage: '<yellow>использование: /bi sortlock list|clear|slot|item|items|clearitems (Номера слотов являются внутренними слотами
    основного инвентаря 9–35).'
  invalid: <red>Выберите внутренний слот для основного инвентаря от 9 до 35 или используйте список/клир.
  list-empty: <gray>Никакие слоты для основной инвентаря не заблокированы. Номера слотов используют внутреннюю нумерацию Minecraft
    9-35.
  list: '<gray>Закрытые слоты для основной инвентаря (внутренние Minecraft номер 9-35): <white>{slots}'
  locked: <green>Слот {slot} для основной инвентаря теперь заблокирован от сортировки.
  unlocked: <green>Слот {slot} больше не заблокирован от сортировки.
  cleared: <green>Все ваши личные сортировочные замки были сняты.
chest-priority:
  usage: '<yellow>использование: /bi chestpriority add|overflow|remove|list|clear. Для add/overflow/remove, Посмотрите на
    заряженную сундук внутри 6 blocks.'
  look-at-chest: <red>Сначала посмотрите на заряженную сундук в пределах 6 блоков.
  limit: <red>Вы можете сохранить максимум 8 предпочтительных положений сундука и 1 положение переполнения.
  add: '<green>Предпочтительная сундук: {chest}'
  overflow: '<green>Установите переполненную сундук: {chest}'
  remove: '<green>Снятое предпочтение сундуке: {chest}'
  cleared: <green>Очистил ваши личные приоритеты.
  list-empty: <gray>У вас нет личных приоритетов.
  list: '<gray>Предпочтительные сундуки (в порядке): <white>{chests}<gray> Перелив (последний, только совпадающие элементы):
    <white>{overflow}'
vacuum:
  chests: <green>Вакуумные {moved} сбрасывали предметы в {chests} сундук(ы).
  inventory: <green>Вакуумные {moved} предметов в вашем инвентаре.
  nothing: <gray>Никаких совпадающих брошенных предметов не пылесосили.
upgrade:
  maxed: <yellow>Этот путь обновления уже максимизирован.
  offer-changed: <yellow>Предложение по модернизации изменилось.
  need-xp: <red>Для этого обновления вам нужно {cost} XP баллов.
  done: '<green>{upgrade} повышен до уровня {level}. <gray>Стоимость: {cost} XP'
  line: '{upgrade}: {level}/{max} | {value} -> {next} | {cost} XP'
  line-max: '{upgrade}: {level}/{max} | {value} -> MAX | MAX'
  button: '{upgrade} ({next}, {cost} XP)'
machine-diagnostic:
  header: '<gold>{machine}<gray> Отчет о строительстве:'
  unloaded: '<yellow>{machine}: детали в незагруженном чанке еще не могут быть проверены.'
  finding: '<gray>{part}: ожидаемый <white>{expected}<gray>Найдено <white>{actual}<gray> в <white>{x}, {y}, {z}<gray>.'
  part:
    control: блок управления
    base: основание
    lower-base: нижняя основа
    pedestal: пьедестал
    foundation: фундамент
    ring: кольцо
combo:
  mine:
    header: '<gold>Ваши комбо блоков <gray>({count}):'
    empty: <gray>Вы еще не построили блок комбо. /bi combos показывает как.
    entry-here: <gray>• {name} <gray>| {x} {y} {z} | {blocks} м
    entry-elsewhere: <gray>• {name} <gray>| {world} {x} {y} {z}
    more: <gray>... и еще {count}.
    hint: <dark_gray>Комбо, построенные до 2.20.0, появляются здесь, как только вы их используете.
  sorter:
    name: Изобретатель Sorter
    structure: легковесная (золотая) пластина давления на любом полном медном строительном блоке
  vacuum:
    name: Пункт Вакуум
    structure: тяжеловесная (железная) пластина давления на любом полном медном строительном блоке
  launcher:
    name: Прямая пусковая установка
    structure: блок слизи на блоке красного камня; необязательно 3×3 слизевого поля вокруг центра
  booster:
    name: Спринтерский бустер
    structure: лед, упакованный лед или синий лед на блоке из красного камня
  float-launcher:
    name: Плавучий лифт
    structure: белая терракота на медном строительном блоке на блоке из красного камня
  heal:
    name: Исцеляющий блок
    structure: Медовый блок на блоке из красного камня
  harvester:
    name: жатва
    structure: Композитор на сенной булке
  warp-pad:
    name: Варп Пад
    structure: Плачущий обсидиан / Crying Obsidian
    unnamed: Пад {x} {y} {z}
    limit: <red>Вы уже владеете максимумом <white>{max}</white> Варп-прокладки. <gray>Сначала сломай одного из своих.
    disabled: <red>Варп-плейды выключены на этом сервере.
    no-access: <red>Вам не разрешается использовать эту варп-прокладку. <gray>Владелец может поделиться им с вами.
    no-destinations: <yellow>Никакая другая варп-площадка, которую вы можете использовать, не находится внутри <white>{blocks}</white>
      блоков в этом мире. <gray>Постройте второй блок или попросите друга поделиться своим.
    gone: <red>Эта варп-площадка исчезла или неполная.
    stand-on-pad: <yellow>Встаньте на варп-прокладку, чтобы путешествовать.
    too-far: <red>Это место находится вне досягаемости<white>{blocks}</white> блоков). <gray>Увеличьте расстояние до этой
      площадки.
    cooldown: '<yellow>Ваш варп заряжается: <white>{seconds}</white> С.'
    blocked: '<red>{name} блокируется: <gray>Два блока над ним должны быть свободными.'
    arrived: <light_purple>изогнутый до <white>{name}</white>.
    not-yours: <red>Сделать это может только владелец этого деформатора.
    usage: '<yellow>использование: /bi warppads list | share NAME | unshare NAME'
    dialog:
      name: '<gray>Имя: <white>{name}'
      use: <gray>Стоять на прокладке и пробираться путешествовать. совместно с <white>{guests}</white> Игрок(ы).
      rename: Переименовать
      rename-tooltip: Дайте этой панели имя для меню путешествия (только владелец)
    rename:
      title: Переименовать варп-пад
      question: 'Новое имя (буквы, цифры, пробелы):'
      invalid: <red>Это имя пустое или недействительное. <gray>Используйте до {max} букв, цифр и пробелов.
      done: <green>Warppad переименовали в <white>{name}</white>.
    travel:
      title: Варп Пад
      body: '<gray>из <white>{name}</white> <gray>Достижение <white>{blocks}</white> блоки. Выберите пункт назначения:'
      button: '{name} ({distance} м)'
      tooltip: '{owner} | {x} {y} {z}'
      own: Твоя подушка
      shared: Доля {owner}
    state:
      active: активный
      incomplete: неполный
      unloaded: не загруженный
    list:
      header: '<light_purple>Твои варп-прокладки <gray>({count}/{max}):'
      empty: '<gray>Пока нет. Постройте один: лодестоун на плачущем обсидиане.'
      entry: <gray>• <white>{name}</white> <gray>| достичь {blocks} блоков | {state}
      guests: '<gray>Совместно с: <white>{players}'
      no-guests: <gray>Ни с кем не делился.
      hint: '<gray>Поделиться с игроком: sneak + right-click → Варп-прокладки, или /bi warppads share NAME.'
    share:
      added: <green>{player} теперь может использовать все ваши варп-прокладки.
      removed: <yellow>{player} больше не может использовать варп-прокладки.
      unchanged: <gray>Ничего не изменилось за {player}.
      full: <red>Вы уже делитесь своими колодками с {max} игроков.
      self: <red>Ваши собственные подушки всегда ваши.
      unknown: <red>Ни один игрок по имени {player} не играл здесь.
    menu:
      shared: '<light_purple>Warppads: общий'
      not-shared: '<gray>Варп-прокладки: не делятся'
      lore-shared: |-
        <gray>{player} может перемещаться по вашей варп-платформе {pads}.
        <yellow>Click: Возврат доступа
      lore-not-shared: |-
        <gray>Позвольте {player} путешествовать на вашей варп-платформе {pads}.
        <yellow>Click: Поделиться
  xp-collector:
    name: XP Коллекционер
    structure: Очаровательный стол на блоке лаписа
    owner-only: <red>Только владелец этого коллектора XP может взять его XP.
    empty: <gray>Коллектор XP пуст.
