    name: Слизевое поле 3×3
    info: Общие обновления для всех девяти блоков слизи. Центральный блок сохраняет обновления, когда он сломан.
  guide:
    header: <gold><bold>Блок комбо</bold></gold> <gray>- Обновления
    open: <gray>Sneak + щелкните правой кнопкой мыши верхний функциональный блок, чтобы открыть меню обновления.
    structure: '{name}<gray>: {structure}'
    paths: <gray>В зависимости от структуры, диапазона, мощности, продолжительности эффекта и времени восстановления можно
      повысить до уровня <white>{max}<gray>.
    float: <gray>Поплавковый подъемник уже дает пять секунд Левитации I на уровне 0.
    heal: '<gray>Целебный блок медленно исцеляет игроков внутри своей ауры. После нанесения урона он ждет {seconds} секунд;
      минимальное расстояние: <white>{distance} блоков<gray>.'
    warp: '<gray>Варп-пад: встаньте на лодочный камень и прокрадитесь, чтобы выбрать пункт назначения. Поделитесь своими колодками
      с друзьями через меню игрока или /bi warppads.'
    xp: '<gray>Коллектор XP: собирает шары, рядом с которыми не стоит игрок; возьмите XP в его меню. Разбивая его, разливается
      хранящийся XP.'
  heal-too-close: '<red>Следующий блок заживления слишком близко. <gray>Минимальное расстояние: <white>{distance} блоков<gray>.'
  claimed: <gray>Этот блок-комбо еще не имел владельца и теперь принадлежит вам (он указан на вашей веб-странице).
  claim-denied: <gray>У этого блока пока нет владельца. Только тот, кто может построить здесь, может взять его на себя; до
    тех пор только администраторы могут взять XP или переименовать его.
  recognized: '<green>Признано {name}. <gray>Sneak + щелкните правой кнопкой мыши верхний блок, чтобы открыть обновления. '
  no-use: <red>Вам не разрешается использовать блок-комбо.
  no-upgrade: <red>Вам не разрешается обновлять комбо блоков.
  incomplete: <red>Блок-комбо больше не является полным.
  dialog:
    title: '{name} обновлений'
    header: '{name} | максимальный уровень {max}'
    line: '{upgrade}: {level}/{max} | {value} | {cost} XP'
    line-max: '{upgrade}: {level}/{max} | {value} | MAX'
    button: '{upgrade} ({cost} XP)'
  value:
