# Русский — UTF-8. Keep keys, placeholders and formatting tokens unchanged.
title: BlockIntegrations
permission: blockintegrations.use
pages:
- title: Начало работы
  text: |
    BlockIntegrations строит функции непосредственно из блоков мира. Шесть блоков комбо, башни и модернизируемые печи работают независимо друг от друга.

    1. Создайте структуру, описанную ниже, полностью.
    2. Используйте верхний функциональный блок или описанное движение.
    3. Для обновляемых структур подкрадывайтесь + правый клик, чтобы открыть меню и оплатить обновления с реальным XP points.

    Обзор в игре: /vmenu → Строительство и технологии → Блоки и обновления (or /bi). Там вы найдете гиды для комбо, башен и печей; в чате вы также можете использовать /bi combos, /bi towers и /bi furnaces. Каждому гиду требуется соответствующее разрешение.

    Все меню обновления имеют кнопки "← Назад" (to the overview) и "⌂ Главное меню".

    Если комбо или башня неполны, щелкните правой кнопкой мыши по вероятному блоку управления (with the matching permission) Недостающие или неправильные блоки и их координаты. Чек считывает только загруженные чанки и никогда ничего не ремонтирует.
- title: Сортировщик инвентаря
  permission: blockintegrations.combos
  text: |
    Сортировщик перемещает предметы из вашего основного инвентаря в близлежащие сундуки, которые уже содержат тот же предмет.

    1. Поместите легковесную (золотую) пластину давления на любой полный медный строительный блок.
    2. Положите сундуки рядом и поместите в них один образец каждого вида.
    3. Перепрыгивайте на тарелку: сортируются прорези 9–35; горячая перекладина, доспехи и без рук остаются нетронутыми.
    4. Присядьте + щелкните правой кнопкой мыши пластину, чтобы обновить диапазон или время восстановления. Диапазон по умолчанию составляет 10 блоков.
- title: Пункт вакуум
  permission: blockintegrations.combos
  text: |
    Вакуум втягивает упавшие предметы и предпочитает сортировать их в сундуки.

    1. Поместите тяжеловесную (железную) пластину давления на любой полный медный строительный блок.
    2. Положите предварительно сортированные сундуки рядом, если предметы должны закончиться там.
    3. Прыгай на тарелку. Только если в зоне поиска нет сундука, предметы попадают в ваш основной инвентарь.
    4. Присядьте + щелкните правой кнопкой мыши пластину, чтобы обновить диапазон или время восстановления. По умолчанию: радиус 20 блоков и время восстановления 20 клещей.
- title: Пусковая установка и слизевое поле
  permission: blockintegrations.combos
  text: |
    Направленная пусковая установка бросает вас в том направлении, в котором вы смотрите.

    1. Поместите блок слизи на блок из красного камня и прыгайте на него.
    2. Для поля проложите девять слизистых блоков как плоские 3×3 на той же высоте; красный камень проходит только под центральным блоком.
    3. Все девять блоков используют питание и время восстановления центра. Присядьте + щелкните правой кнопкой мыши любой блок поля, чтобы открыть общее меню обновления.
    4. Мощность и время восстановления могут быть увеличены. По умолчанию мощность 1.70 дает около 15 блоков при взгляде горизонтально; время восстановления составляет 20 клещей.
- title: Ускоритель Sprint
  permission: blockintegrations.combos
  text: |
    Бустер ускоряет спринт игроков в том направлении, в котором они фактически работают.

    1. Поместите лед, упакованный лед или синий лед прямо на блок из красного камня.
    2. Спринтер над ледяной глыбой.
    3. Присядьте + щелкните правой кнопкой мыши ледяной блок для повышения мощности или времени восстановления.

    Дефолты - мощность 1.15 и время восстановления клеща 10. По умолчанию бустерный лед не тает.
- title: Поплавковый лифт и лечебный блок
  permission: blockintegrations.combos
  text: |
    Поплавковый лифт и лечебный блок являются стационарными опорными структурами.

    1. Плавающий лифт: поместите белую терракоту на полный медный строительный блок на красном камне, прыгайте и касайтесь терракоты. Он запускает вас прямо и дает левитацию.
    2. Обновить мощность, время левитации или время восстановления с помощью sneak + right-click. База: 5 секунд левитации, 60 клещей время восстановления.
    3. Целебный блок: поместите медовый блок прямо на красный камень.
    4. Он исцеляет игроков в своей ауре каждые 3 секунд. После нанесения урона заживление останавливается как минимум на 5 секунд. Диапазон, количество исцеления и время восстановления могут быть улучшены.
- title: Комбо модернизируется и движется
  permission: blockintegrations.combos.upgrade
  text: |
    Каждая комбинация имеет только соответствующие пути обновления: диапазон сортировки / вакуума и время восстановления; мощность пусковой установки / бустера и время восстановления; мощность плавающего подъема, продолжительность и время восстановления; диапазон заживляющих блоков, количество заживления и время восстановления.

    1. Sneak + правый клик по функциональному блоку.
    2. Выберите путь в меню, на кнопке указана цена XP.
    3. Их количество достигает 10. Диапазон увеличивается на 1 блоков на уровень, продолжительность плавания на 0.5 секунду, а время восстановления сокращается на 5 % на уровень, но никогда не ниже 5 клещей.
    4. Разбейте функциональный блок: выпавший элемент сохраняет свои обновления и применяет их при повторном размещении.
- title: 'Башни: как их строят'
  permission: blockintegrations.towers
  text: |
    Сверху вниз каждая башня состоит из головы, рабочего блока и фундамента. На высоте фундамента четыре кольцевых блока стоят в кресте на север, юг, восток и запад. Голова - точка атаки, меню обновления и доступ к добыче.

    1. Постройте один из точных типов ниже.
    2. Присядьте + щелкните правой кнопкой мыши, чтобы открыть добычу или обновления.
    3. Башни атакуют враждебных существ только в заряженных чанках.
    4. Существо падает и убивает XP башен, которые в последний раз попали в его виртуальную сундук.
- title: 'Башни: стартовые типы'
  permission: blockintegrations.towers
  text: |
    Эти дешевые башни не имеют модернизации.

    1. Зомби Сторожевая Башня: Голова зомби → крафтовый стол → булыжник; четыре дубовые доски в кресте на высоте фундамента. Точная атака: 2 повреждений, 8 дальность блоков, 30 клещей.
    2. Recruit Tower: голова игрока → баррель → камень; четыре булыжника в кресте на высоте фундамента. Точная атака: 3 повреждений, 9 дальность блоков, 26 клещей.
    3. Присядьте + щелкните правой кнопкой мыши голову, чтобы опустошить сундук.
- title: 'Башни: лучник и пушка'
  permission: blockintegrations.towers
  text: |
    1. Арчер Тауэр: скелетный череп → сверкающий стол → любой полный медный строительный блок; четыре каменных кирпича в кресте на высоте фундамента. Точные атаки, повреждения базы 4, диапазон 14, 20 клещей.
    2. Башня Кэннон: Крепер-Хед → распределитель → доменная печь; четыре обсидиановых блока в кресте на высоте фундамента. Ущерб площади без разрушения блоков, повреждение базы 8, диапазон 11, 40 клещей.
    3. Присядьте + щелкните правой кнопкой мыши по голове для добычи и для повреждений, дальности, скорости и обновления грабежей.
- title: 'Башни: пламя, свинья, дракон'
  permission: blockintegrations.towers
  text: |
    1. Огненная башня: увядающий череп скелета → магматический блок → Чистые кирпичи; четыре полированных кирпича из черного камня в кресте. База 5 повреждений, дальность 10, 24 клещей; зажигает цели в течение 3 секунд.
    2. Золотая башня Свиньи: голова свиньи → кузнечный стол → золотой блок; четыре полированных кирпича из черного камня. База 6 повреждений, диапазон 12, 16 клещей; быстрая точная башня.
    3. Башня Дракона: голова Дракона → возродить якорь → пурпурный блок; четыре торцевых каменных кирпича. База 12 повреждений, диапазон 16, 50 клещей; большая площадь повреждения.
- title: Обновление башни и добыча
  permission: blockintegrations.towers.upgrade
  text: |
    1. Присядьте + щелкните правой кнопкой мыши голову башни.
    2. Покупайте повреждения, диапазон или скорость до уровня 10. Разграбление имеет максимум 3 уровней и может добавить дополнительные элементы к подходящим складным каплям.
    3. "Открытая сундук" показывает предметы; «Уничтожить XP» выплачивает собранные XP.
    4. Когда вы ломаете башню, выпадающая голова сохраняет апгрейды; содержимое сундука сбрасывается так, что предметы и XP не теряются.
- title: Модернизированные печи
  permission: blockintegrations.furnaces
  text: |
    Поддерживаются печи, доменные печи и курильщики. Когда вы делаете это, вы становитесь его постоянным владельцем. Sneak + right-click претендует на старую печь без владельца для вас.

    1. Поместите поддерживаемую печь и используйте ее обычно для плавки.
    2. Sneak + щелкните правой кнопкой мыши для меню обновления.
    3. При установке Vystorm Skills даже плавка на корме для бункеровки дает фиксированному владельцу плавку / приготовление пищи XP; XP заработанных в автономном режиме хранится и поставляется при входе в систему.
    4. Управлять им может только владелец; печи других игроков нуждаются в blockintegrations.furnaces.manage-others.
- title: Обновление печи и перемещение
  permission: blockintegrations.furnaces.upgrade
  text: |
    1. Присядьте + правой кнопкой мыши, чтобы открыть меню печи и заплатите реальными XP баллов.
    2. До уровня 10: скорость плавки, топливная экономичность, бонусный выход и мультиплавка. Каждый уровень мультиплавки обрабатывает еще один элемент ввода на цикл плавки, ограниченный слотом ввода и вывода.
    3. Повышение XP поднимается до уровня 5 и повышает накопленную ванильную печь XP и навык плавки / приготовления пищи XP (Vystorm Навыки) на 20 % на уровень.
    4. Выберите собранную ваниль XP в меню с «Отозвать сохраненную XP». При поломке печь сохраняет свои обновления, фиксированный владелец и сохраненный бонус XP.
- title: Пивоваренные трибуны и костры
  permission: blockintegrations.workstations
  text: |
    Присядьте и нажмите правой кнопкой мыши на зельеварку, костёр или костёр душ, чтобы открыть меню улучшений. Владельцем становится игрок, установивший блок. Старый блок без владельца закрепляется за игроком при первом открытии этого меню.
    Зельеварки: +12% к скорости приготовления и +10% к эффективности топлива за уровень. Костры: +12% к скорости приготовления еды и +2.5 процентного пункта к вероятности получить дополнительную приготовленную еду за уровень.
    По умолчанию доступно 10 уровней. Следующий уровень стоит 100, умноженное на квадрат его номера, в очках XP. Оставайтесь в пределах восьми блоков. Покупать улучшения могут только владельцы и администраторы; обычное использование доступно всем.
    Бонусы действуют на операции, начатые после улучшения. Подобранные блоки сохраняют владельца и улучшения; для костров нужно зачарование «Шёлковое касание». Руководство в чате: /bi workstations.
- title: Башня анимация
  permission: blockintegrations.towers
  text: |
    Каждая башня имеет свой собственный дульный эффект и короткий анимированный след. Пушки стреляют по дуге. Успешные попадания показывают частицы; пушечные и огненные попадания также расширяются в кольца.
    Время атаки и повреждения остаются неизменными. Администраторы могут отключить косметику с towers.visual-effects в config.yml.
- title: Ловушки монстров
  permission: blockintegrations.traps
  text: |
    Построить 3×3 обсидиановый каркас (eight blocks). Ядро: поршень для метания, железный блок для шипов, медовый блок для замедления.
    Прикрепите кнопку к передней части блока кадра. Пистон и кнопка указывают в направлении эффекта. Полы, стены и потолки работают.
    Первый щелчок правой кнопкой мыши регистрирует ловушку. Sneak-right-click для автоматического режима 10/15 Второе время восстановления. Серверные по умолчанию применяются только к новым ловушкам.
    Кнопка и автоматический запуск имеют продолжительное время восстановления. район: 3×3 Протяженность три блока вперед, с линией обзора. Только враждебные монстры; нет игроков или домашних животных.
    Настройки сервера: /vsettings server → BlockIntegrations → Ловушки. Полное руководство: /bi traps.
- title: Слинг-ловушки
  permission: blockintegrations.traps
  text: |
    Прядильная ловушка: блок слизи в обсидиановой раме с ровно одной передней кнопкой. Полы / потолки отскакивают от кнопки; стены отскакивают вперед и вверх.
    Нажмите кнопку для запуска; щелкните правой кнопкой мыши для автоматического режима и времени восстановления 10/15 секунды. Администраторы настраивают питание и подъем в настройках Traps.
- title: Обновить наковальню
  permission: blockintegrations.anvils
  text: |
    Правильно щелкните наковальню, чтобы открыть ее меню. Слева внизу: модернизация наковальни. Центр: использовать наковальню.
    Эффективность: 5% меньше XP уровней на ранг (максимум). 50%). Очарования: +1 до нормальных шапок за ранг (максимум +5), снимает Слишком дорого. Долговечность: отсутствие износа. Модернизация обошлась в XP пунктов.
    Цена по умолчанию: 100 раз новый ранг в квадрате. Долговечность стоит 2500 XP баллов один раз. Владение и модернизация выживают после добычи и падения.
- title: Меню Brew Stand
  permission: blockintegrations.workstations
  text: |
    Правильный клик открывает меню пивоваренной стойки. Внизу слева: модернизация пивоваренного стенда; в центре: использование пивоваренного стенда. Shift + right-click открывает обновления напрямую. Скорость и топливная экономичность имеют до 10 рангов; цена по умолчанию составляет 100 раз больше нового ранга в XP балла.
- title: Позиционные бонусы
  permission: blockintegrations.workstations
  text: |
    Дополнительный эффект: 5 рангов по 1% каждый, максимум 5%. Сила: 10 занимает 10% шанс каждый для +1 уровня эффекта, максимум 100%. Продолжительность: 10 рангов по 25, максимум + 250; мгновенные эффекты остаются мгновенными.
    Базовые цены умножают новый ранг в квадрате: дополнительные 5000, сила 10000, продолжительность 1000 XP баллов. Один рулон на готовую бутылку, включая неудачные рулоны. Дополнительно: случайный положительный эффект уровня I в течение 30 лет плюс бонус продолжительности.
